syntax = "proto3";

package cbp.agent.v1;

option go_package = "cbp/agent-rpc;rpc";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

service Controller {
  // The string value is the one-time enrollment code.
  rpc Enroll(google.protobuf.StringValue) returns (google.protobuf.Empty);

  // Revokes only the enrollment authenticated by the caller's agent credential.
  rpc Unregister(google.protobuf.Empty) returns (google.protobuf.Empty);

  // The report includes host metadata, allowed services and listener results.
  // The reply can include targets to check before the next report and a continuation cursor.
  rpc CheckIn(google.protobuf.Struct) returns (google.protobuf.Struct);

  // A job contains id, engine, endpoint, fullchain and privateKey. An empty reply means no job.
  rpc ClaimDeployment(google.protobuf.Empty) returns (google.protobuf.Struct);

  // The result contains jobId and outcome, with an optional certificate diagnostic.
  rpc FinishDeployment(google.protobuf.Struct) returns (google.protobuf.Empty);
}
