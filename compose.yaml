x-database-url: &database-url 'postgresql://cbp:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}@db:5432/cbp'
# Docker passes these predefined proxy args to RUN steps without storing them in the image.
x-proxy-args: &proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
  HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
  NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
  http_proxy: ${HTTP_PROXY:-${http_proxy:-}}
  https_proxy: ${HTTPS_PROXY:-${https_proxy:-}}
  no_proxy: ${NO_PROXY:-${no_proxy:-}}
x-web-build: &web-build
  context: .
  target: web
  args: *proxy-args

services:
  db:
    image: postgres:19.0-alpine3.23
    environment:
      POSTGRES_DB: cbp
      POSTGRES_USER: cbp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - cbp-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U cbp -d cbp']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db-setup:
    image: cbp-web:local
    build: *web-build
    environment:
      DATABASE_URL: *database-url
      CBP_DATABASE_WEB_PASSWORD: ${CBP_DATABASE_WEB_PASSWORD:?Set a URL-safe CBP_DATABASE_WEB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    command: ['bun', '--filter', '@cbp/database', 'db:setup-controller']

  web:
    image: cbp-web:local
    build: *web-build
    environment:
      DATABASE_URL: 'postgresql://cbp_web:${CBP_DATABASE_WEB_PASSWORD:?Set a URL-safe CBP_DATABASE_WEB_PASSWORD in .env}@db:5432/cbp'
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      CBP_ADMIN_EMAILS: ${CBP_ADMIN_EMAILS:-}
      CBP_TRUSTED_PROXY_TOKEN: ${CBP_TRUSTED_PROXY_TOKEN:-}
      CBP_CONTROLLER_TOKEN: ${CBP_CONTROLLER_TOKEN:?Set CBP_CONTROLLER_TOKEN in .env}
      CBP_ANSIBLE_TOKEN: ${CBP_ANSIBLE_TOKEN:-}
      CBP_VAULT_ADDR: ${CBP_VAULT_ADDR:-}
      CBP_VAULT_TOKEN: ${CBP_VAULT_TOKEN:-}
      CBP_LETS_ENCRYPT_EMAIL: ${CBP_LETS_ENCRYPT_EMAIL:-}
      CBP_ALERT_SLACK_TOKEN: ${CBP_ALERT_SLACK_TOKEN:-}
      CBP_ALERT_LINE_TOKEN: ${CBP_ALERT_LINE_TOKEN:-}
      CBP_ALERT_TELEGRAM_TOKEN: ${CBP_ALERT_TELEGRAM_TOKEN:-}
      CBP_ALERT_RESEND_API_KEY: ${CBP_ALERT_RESEND_API_KEY:-}
      CBP_ALERT_EMAIL_FROM: ${CBP_ALERT_EMAIL_FROM:-}
      CBP_ALERT_WEBHOOKS: ${CBP_ALERT_WEBHOOKS:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
      CBP_AGENT_CONTROLLER_ADDRESS: ${CBP_AGENT_CONTROLLER_ADDRESS:?Set the controller address agents can reach}
      CBP_AGENT_CA_FILE: ${CBP_AGENT_CA_FILE:-}
      CBP_AGENT_CA_DOWNLOAD_FILE: ${CBP_AGENT_CA_DOWNLOAD_FILE:+/run/cbp/agent-ca-download.pem}
    volumes:
      - type: bind
        source: ${CBP_AGENT_CA_DOWNLOAD_FILE:-${CBP_CONTROLLER_TLS_CERT:-./controller-fullchain.pem}}
        target: /run/cbp/agent-ca-download.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db-setup:
        condition: service_completed_successfully
    ports:
      - '${CBP_WEB_BIND:-127.0.0.1}:${CBP_WEB_PORT:-3000}:3000'
      - target: 50051
        published: '${CBP_CONTROLLER_PORT:-50051}'
        host_ip: ${CBP_CONTROLLER_BIND:-127.0.0.1}
        protocol: tcp
    # Loopback check: unset the proxy so the request stays local, and skip TLS verification
    # because the certificate names the public host, not 127.0.0.1.
    healthcheck:
      test:
        - CMD
        - env
        - -u
        - HTTP_PROXY
        - -u
        - HTTPS_PROXY
        - -u
        - http_proxy
        - -u
        - https_proxy
        - bun
        - -e
        - "const scheme = Bun.env.CBP_WEB_TLS_CERT ? 'https' : 'http'; const response = await fetch(scheme + '://127.0.0.1:3000/signin', { redirect: 'manual', tls: { rejectUnauthorized: false }, signal: AbortSignal.timeout(4000) }); process.exit(response.status < 500 ? 0 : 1);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  vault:
    profiles: [vault]
    build:
      context: .
      target: vault
      args: *proxy-args
    # The image entrypoint already loads /vault/config; naming the file again doubles the listener.
    command: ['server']
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    network_mode: service:web
    depends_on:
      web:
        condition: service_started
        restart: true
    cap_add: [IPC_LOCK]
    volumes:
      - cbp-vault:/vault/file
    restart: unless-stopped

  controller:
    build:
      context: .
      target: controller
      args: *proxy-args
    environment:
      CBP_CONTROLLER_TOKEN: ${CBP_CONTROLLER_TOKEN:?Set CBP_CONTROLLER_TOKEN in .env}
      CBP_WEB_URL: http://127.0.0.1:3000
    # The controller can use plain HTTP on loopback inside this shared namespace.
    network_mode: service:web
    depends_on:
      web:
        condition: service_started
        restart: true
    volumes:
      - type: bind
        source: ${CBP_CONTROLLER_TLS_CERT:-./controller-fullchain.pem}
        target: /run/cbp/controller-fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CBP_CONTROLLER_TLS_KEY:-./controller.key}
        target: /run/cbp/controller.key
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  ansible:
    profiles: [ansible]
    build:
      context: .
      target: ansible
      args: *proxy-args
    init: true
    environment:
      CBP_ANSIBLE_TOKEN: ${CBP_ANSIBLE_TOKEN:-}
      CBP_ANSIBLE_WEB_URL: http://127.0.0.1:3000
    network_mode: service:web
    depends_on:
      web:
        condition: service_started
        restart: true
    volumes:
      - type: bind
        source: ${CBP_ANSIBLE_CONFIG_DIR:-./ansible-config}
        target: /run/cbp/ansible
        read_only: true
        bind:
          create_host_path: false
      - cbp-ansible-ssh:/home/cbp-runner/.ssh
    restart: unless-stopped

volumes:
  cbp-db:
  cbp-vault:
  cbp-ansible-ssh:
