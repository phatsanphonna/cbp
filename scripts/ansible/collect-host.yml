---
- name: Collect host inventory before certificate deployment
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Check the inventory selection
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == [cbp_inventory_host]

    - name: Read basic host facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
      no_log: true

    - name: Read the full operating system name
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"
          - -c
          - |
            import platform

            try:
                name = platform.freedesktop_os_release().get("PRETTY_NAME", "").strip()
            except (AttributeError, OSError, UnicodeError):
                name = ""
            if len(name.encode("utf-8")) <= 256 and not any(c in name for c in "\0\r\n"):
                print(name)
      register: cbp_os_release
      changed_when: false
      failed_when: false
      no_log: true

    - name: Save the host inventory report on the runner
      ansible.builtin.copy:
        content: >-
          {{ {
            'hostname': cbp_host_facts.hostname,
            'fqdn': cbp_host_facts.fqdn | default(''),
            'operatingSystem': cbp_pretty_os_name or (
              (cbp_host_facts.distribution | default(cbp_host_facts.system))
              ~ ' ' ~ (cbp_host_facts.distribution_version | default(''))),
            'architecture': cbp_host_facts.architecture
          } | to_json }}
        dest: "{{ cbp_host_report_path }}"
        mode: '0600'
      vars:
        ansible_connection: local
        cbp_host_facts: "{{ hostvars[inventory_hostname].ansible_facts }}"
        cbp_pretty_os_name: "{{ hostvars[inventory_hostname].cbp_os_release.stdout | default('') | trim }}"
      delegate_to: localhost
      no_log: true
      diff: false
